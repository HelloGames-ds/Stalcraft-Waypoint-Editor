name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --clean --noconfirm simplemapper_runtime.spec

      - name: Package maps
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path .\assets\maps\zone_pack_png -DestinationPath .\dist\zone_pack_png.zip -Force

      - name: Upload build artifacts (always)
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            dist/*.exe
            dist/*.zip

      - name: Release sync (create or update assets)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "$env:GITHUB_REF_NAME"

          $exe = "dist/Waypoint-Editor.exe"
          $zip = "dist/zone_pack_png.zip"

          # получить список assets релиза
          $assets = gh release view $tag --json assets --jq '.assets[].name' 2>$null

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release not found -> creating"
            gh release create $tag $exe $zip --title $tag --notes "Automated build"
            exit 0
          }

          Write-Host "Existing assets: $assets"

          if ($assets -notmatch "Waypoint-Editor.exe") {
            gh release upload $tag $exe --clobber
          }

          if ($assets -notmatch "zone_pack_png.zip") {
            gh release upload $tag $zip --clobber
          }

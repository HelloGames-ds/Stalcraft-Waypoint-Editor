name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Show build inputs (debug)
        run: |
          Write-Host "=== Directory structure ==="
          Get-ChildItem . -Recurse | Select-Object FullName

      - name: Build onefile EXE
        run: |
          pyinstaller --clean --noconfirm --log-level DEBUG simplemapper_runtime.spec *>&1 | Tee-Object -FilePath pyinstaller-build.log

      - name: Package map pack (ZIP)
        run: |
          Write-Host "=== Starting map pack creation ==="
          
          $distPath = "dist"
          New-Item -ItemType Directory -Force -Path $distPath | Out-Null
          
          $mapsFolder = ".\assets\maps\zone_pack_png"
          
          if (Test-Path $mapsFolder) {
            Write-Host "Found maps folder: $mapsFolder"
            Push-Location .\assets\maps
            Compress-Archive -Path .\zone_pack_png -DestinationPath "$env:GITHUB_WORKSPACE\dist\zone_pack_png.zip" -Force
            Pop-Location
            Write-Host "ZIP created successfully"
          } else {
            Write-Host "ERROR: Folder $mapsFolder not found!"
            Get-ChildItem .\assets\maps -Recurse -ErrorAction SilentlyContinue
          }

          # Проверяем, что получилось
          Get-ChildItem dist -ErrorAction SilentlyContinue

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pyinstaller-build-log
          path: pyinstaller-build.log

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v7
        with:
          name: Waypoint-Editor-windows
          path: dist/Waypoint-Editor.exe

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: zone_pack_png
          path: dist/zone_pack_png.zip

      - name: Attach assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $exePath = "dist/Waypoint-Editor.exe"
          $zipPath = "dist/zone_pack_png.zip"

          Write-Host "=== Attaching assets to $env:TAG ==="

          if (-not (Test-Path $exePath)) { Write-Host "EXE not found!"; exit 1 }
          if (-not (Test-Path $zipPath)) { Write-Host "ZIP not found!"; exit 1 }

          gh release view $env:TAG *> $null 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Creating new release..."
            gh release create $env:TAG $exePath $zipPath --title $env:TAG --notes "Automated Windows build."
          } else {
            Write-Host "Uploading assets..."
            gh release upload $env:TAG $exePath --clobber
            gh release upload $env:TAG $zipPath --clobber
          }

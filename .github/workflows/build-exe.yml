name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --clean --noconfirm simplemapper_runtime.spec

      - name: Package maps
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path .\assets\maps\zone_pack_png -DestinationPath .\dist\zone_pack_png.zip -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: dist/*

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"

          $exe = "dist/Waypoint-Editor.exe"
          $zip = "dist/zone_pack_png.zip"

          Write-Host "Syncing release: $tag"

          $assets = gh release view $tag --json assets --jq '.assets[].name' 2>$null

          if (-not $assets) {
            gh release upload $tag $exe $zip --clobber
            exit 0
          }

          if ($assets -notmatch "Waypoint-Editor.exe") {
            gh release upload $tag $exe --clobber
          }

          if ($assets -notmatch "zone_pack_png.zip") {
            gh release upload $tag $zip --clobber
          }

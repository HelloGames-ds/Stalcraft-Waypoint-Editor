name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --clean --noconfirm simplemapper_runtime.spec

      - name: Prepare ZIP (maps pack)
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path .\assets\maps\zone_pack_png -DestinationPath .\dist\zone_pack_png.zip -Force

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-exe
          path: |
            dist/**/*.exe
          if-no-files-found: error

      - name: Upload maps ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: maps-pack
          path: |
            dist/*.zip
          if-no-files-found: error

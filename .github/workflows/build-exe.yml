name: Build ZIP Package

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create package folder
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null

      - name: Copy project files
        run: |
          robocopy . package /E /XD .git .github /NFL /NDL /NJH /NJS
          exit 0

      - name: Create ZIP
        run: |
          Compress-Archive -Path .\package\* -DestinationPath .\build.zip -Force

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: full-project-zip
          path: build.zip
          if-no-files-found: error

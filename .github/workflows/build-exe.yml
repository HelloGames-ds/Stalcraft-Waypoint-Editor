name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build onefile EXE
        run: |
          pyinstaller --clean --noconfirm --log-level DEBUG simplemapper_runtime.spec *>&1 | Tee-Object -FilePath pyinstaller-build.log

      - name: Package map pack (ZIP)
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Push-Location .\assets\maps
          Compress-Archive -Path .\zone_pack_png -DestinationPath "$env:GITHUB_WORKSPACE\dist\zone_pack_png.zip" -Force
          Pop-Location
          Write-Host "ZIP created successfully: $(Get-Item dist\zone_pack_png.zip | Select-Object Length)"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: Waypoint-Editor-windows
          path: dist/Waypoint-Editor.exe

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: zone_pack_png
          path: dist/zone_pack_png.zip

      - name: Attach assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $exePath = "dist/Waypoint-Editor.exe"
          $zipPath = "dist/zone_pack_png.zip"

          Write-Host "=== Trying to attach assets to $env:TAG ==="

          if (-not (Test-Path $exePath)) { Write-Host "EXE not found!"; exit 1 }
          if (-not (Test-Path $zipPath)) { Write-Host "ZIP not found!"; exit 1 }

          gh release view $env:TAG *> $null 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Creating new release..."
            gh release create $env:TAG $exePath $zipPath --title $env:TAG --notes "Automated Windows one-file build."
          } else {
            Write-Host "Release exists, uploading assets..."
            gh release upload $env:TAG $exePath --clobber
            gh release upload $env:TAG $zipPath --clobber
          }

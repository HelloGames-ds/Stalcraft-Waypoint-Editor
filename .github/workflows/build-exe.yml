name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build onefile EXE
        run: |
          pyinstaller --clean --noconfirm --log-level DEBUG simplemapper_runtime.spec *>&1 | Tee-Object -FilePath pyinstaller-build.log

      - name: Package map pack (ZIP)
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Push-Location .\assets\maps
          Compress-Archive -Path .\zone_pack_png -DestinationPath "$env:GITHUB_WORKSPACE\dist\zone_pack_png.zip" -Force
          Pop-Location

      - name: Attach assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $exePath = "dist/Waypoint-Editor.exe"
          $zipPath = "dist/zone_pack_png.zip"

          Write-Host "=== Trying to attach files to release: $TAG ==="

          if (-not (Test-Path $exePath)) { Write-Error "EXE file not found!"; exit 1 }
          if (-not (Test-Path $zipPath)) { Write-Error "ZIP file not found!"; exit 1 }

          gh release view $TAG *> $null 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Release $TAG does not exist! Please create the release manually first."
            exit 1
          }

          Write-Host "Release found. Uploading assets..."
          gh release upload $TAG $exePath --clobber
          gh release upload $TAG $zipPath --clobber

          Write-Host "Successfully attached EXE and ZIP to release $TAG"

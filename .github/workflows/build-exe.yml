name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Show build inputs
        run: |
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Get-ChildItem .
          Get-ChildItem .\assets -Recurse | Select-Object -First 20 FullName
          Get-Content .\simplemapper_runtime.spec

      - name: Build onefile EXE
        run: |
          pyinstaller --clean --noconfirm --log-level DEBUG simplemapper_runtime.spec *>&1 | Tee-Object -FilePath pyinstaller-build.log

      - name: Package map pack
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Push-Location .\assets\maps
          Compress-Archive -Path .\zone_pack_png -DestinationPath "$env:GITHUB_WORKSPACE\dist\zone_pack_png.zip" -Force
          Pop-Location

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pyinstaller-build-log
          path: pyinstaller-build.log

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v7
        with:
          name: Waypoint-Editor-windows
          path: dist/Waypoint-Editor.exe
          if-no-files-found: error

      - name: Attach assets to GitHub Release (only if no assets exist)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $exePath = "dist/Waypoint-Editor.exe"
          $zipPath = "dist/zone_pack_png.zip"

          # Проверяем, существует ли релиз
          gh release view $env:TAG *> $null 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $env:TAG does not exist. Creating..."
            gh release create $env:TAG $exePath $zipPath --title $env:TAG --notes "Automated Windows build."
            exit 0
          }
          $assets = gh release view $env:TAG --json assets -q '.assets[]?.name'
          if ($assets) {
            Write-Host "Release $env:TAG already has assets. Skipping upload."
            exit 0
          }

          # Если assets нет — загружаем
          Write-Host "Release $env:TAG exists but has no assets. Uploading..."
          gh release upload $env:TAG $exePath --clobber
          gh release upload $env:TAG $zipPath --clobber

name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --clean --noconfirm simplemapper_runtime.spec

      - name: Package maps
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path .\assets\maps\zone_pack_png -DestinationPath .\dist\zone_pack_png.zip -Force

      - name: Debug dist (IMPORTANT)
        run: |
          Get-ChildItem dist -Recurse

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: dist/*

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"

          Write-Host "Release tag: $tag"

          # Проверяем что файлы реально существуют
          if (!(Test-Path "dist")) {
            Write-Host "dist folder not found"
            exit 1
          }

          $files = Get-ChildItem dist -File
          Write-Host "Files in dist:"
          $files

          $exe = Get-ChildItem dist -Recurse -Filter *.exe | Select-Object -First 1
          $zip = Get-ChildItem dist -Recurse -Filter *.zip | Select-Object -First 1

          if (-not $exe) {
            Write-Host "EXE NOT FOUND"
            exit 1
          }

          if (-not $zip) {
            Write-Host "ZIP NOT FOUND"
            exit 1
          }

          $assets = gh release view $tag --json assets --jq '.assets[].name' 2>$null

          Write-Host "Existing assets:"
          Write-Host $assets

          if ($assets -notmatch $exe.Name) {
            Write-Host "Uploading EXE..."
            gh release upload $tag $exe.FullName --clobber
          } else {
            Write-Host "EXE already exists"
          }

          if ($assets -notmatch $zip.Name) {
            Write-Host "Uploading ZIP..."
            gh release upload $tag $zip.FullName --clobber
          } else {
            Write-Host "ZIP already exists"
          }
